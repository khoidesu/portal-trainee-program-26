  <!-- ==================== MODAL: TẠO Trainee MỚI (ADMIN) ==================== -->
  <div class="modal-overlay" id="createTraineeModal">
    <div class="modal-card trainee-form-modal-card">
      <div class="modal-header">
        <div class="modal-header-icon-title">

          <div>
            <h3 class="modal-title">Tạo Người Dùng / Trainee Mới</h3>
            <span class="modal-subtitle">Thêm Trainee mới vào hệ thống</span>
          </div>
        </div>
        <button class="modal-close-btn" id="closeCreateTraineeModalBtn">Đóng</button>
      </div>

      <div class="modal-body">
        <form id="createTraineeForm" class="trainee-edit-form">
          <div class="form-section-title">THÔNG TIN ĐỊNH DANH</div>
          <div class="form-grid-2col">
            <div class="form-group">
              <label for="createTraineeId" class="form-label">Mã Trainee (MSSV) <span
                  class="required">*</span></label>
              <input type="text" id="createTraineeId" class="form-input" placeholder="Ví dụ: 25520999" required>
            </div>
            <div class="form-group">
              <label for="createFullName" class="form-label">Họ và tên Trainee <span class="required">*</span></label>
              <input type="text" id="createFullName" class="form-input" placeholder="Ví dụ: Nguyễn Văn An" required>
            </div>
          </div>

          <div class="form-grid-2col">
            <div class="form-group">
              <label for="createEmail" class="form-label">Email Trainee <span class="required">*</span></label>
              <input type="email" id="createEmail" class="form-input" placeholder="an.nv@trainee.uit.edu.vn" required>
            </div>
            <div class="form-group">
              <label for="createTrack" class="form-label">Nhóm <span
                  class="required">*</span></label>
              <input type="text" id="createTrack" class="form-input" list="traineeTrackOptions" placeholder="Nhập nhóm hoặc Track của chương trình" required>
              <datalist id="traineeTrackOptions"></datalist>
            </div>
          </div>

          <div class="form-grid-2col">
            <div class="form-group">
              <label for="createBatch" class="form-label">Khóa Trainee</label>
              <input type="text" id="createBatch" class="form-input" value="KHMT2026.2">
            </div>
            <div class="form-group">
              <label for="createTotalSessions" class="form-label">Tổng số buổi quy định</label>
              <input type="number" id="createTotalSessions" class="form-input" min="0" max="200" value="0">
            </div>
          </div>

          <div class="form-section-title">CHỈ SỐ KPI & THÀNH TÍCH HỌC TẬP</div>
          <div class="form-grid-3col">
            <div class="form-group">
              <label for="createStars" class="form-label"> Số sao tích lũy <span class="required">*</span></label>
              <input type="number" id="createStars" class="form-input" min="0" max="1000" value="25" required>
            </div>
            <div class="form-group">
              <label for="createAttended" class="form-label"> Số buổi đã học <span class="required">*</span></label>
              <input type="number" id="createAttended" class="form-input" min="0" max="200" value="40" required>
            </div>
            <div class="form-group">
              <label for="createAssignmentScore" class="form-label"> Điểm bài tập (thang 10)</label>
              <input type="number" id="createAssignmentScore" class="form-input" min="0" max="10" step="0.1"
                value="9.0">
            </div>
          </div>

          <div class="form-grid-2col">
            <div class="form-group">
              <label for="createExcused" class="form-label"> Vắng CÓ PHÉP</label>
              <input type="number" id="createExcused" class="form-input" min="0" max="50" value="0">
            </div>
            <div class="form-group">
              <label for="createUnexcused" class="form-label"> Vắng KHÔNG PHÉP</label>
              <input type="number" id="createUnexcused" class="form-input" min="0" max="50" value="0">
            </div>
          </div>

          <div class="form-info-hint" style="background: rgba(37, 99, 235, 0.06); border: 1px dashed rgba(37, 99, 235, 0.25); padding: 12px 16px; border-radius: 8px; font-size: 0.84rem; color: var(--text-secondary); margin-top: 14px; display: flex; align-items: center; gap: 10px;">
            <span style="font-size: 1.2rem;"></span>
            <span>Thứ hạng (Rank) sẽ <strong>tự động xếp hạng</strong> theo số sao tích lũy . Trainee không cần đăng nhập mật khẩu để xem cổng thông tin.</span>
          </div>

          <div class="modal-form-actions">
            <button type="button" class="btn btn-secondary" id="cancelCreateTraineeBtn">Hủy</button>
            <button type="submit" class="btn btn-primary" id="btnSubmitCreateTrainee">
              <span> Tạo Trainee</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
