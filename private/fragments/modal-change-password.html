  <!-- ==================== MODAL: ĐỔI MẬT KHẨU ==================== -->
  <div class="modal-overlay" id="changePasswordModal">
    <div class="modal-card" style="max-width: 440px;">
      <div class="modal-header">
        <div class="modal-header-icon-title">

          <div>
            <h3 class="modal-title">Đổi Mật Khẩu Tài Khoản</h3>
          </div>
        </div>
        <button class="modal-close-btn" id="closeChangePasswordModalBtn">Đóng</button>
      </div>

      <div class="modal-body">
        <form id="changePasswordForm">
          <div class="form-group" style="margin-bottom: 14px;">
            <label for="changePassCurrent" class="form-label">Mật khẩu hiện tại</label>
            <input type="password" id="changePassCurrent" class="form-input"
              placeholder="Nhập mật khẩu đang dùng (mặc định traineeprogram)" required>
          </div>
          <div class="form-group" style="margin-bottom: 14px;">
            <label for="changePassNew" class="form-label">Mật khẩu mới</label>
            <input type="password" id="changePassNew" class="form-input" placeholder="Nhập mật khẩu mới" required
              minlength="4">
          </div>
          <div class="form-group" style="margin-bottom: 20px;">
            <label for="changePassConfirm" class="form-label">Xác nhận mật khẩu mới</label>
            <input type="password" id="changePassConfirm" class="form-input" placeholder="Nhập lại mật khẩu mới"
              required minlength="4">
          </div>
          <div class="modal-form-actions" style="display: flex; justify-content: flex-end; gap: 10px;">
            <button type="button" class="btn btn-secondary" id="cancelChangePasswordBtn">Hủy</button>
            <button type="submit" class="btn btn-primary">
              <span> Lưu Mật Khẩu Mới</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
