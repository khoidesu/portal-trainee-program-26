<!-- ==============================================================================
 * COMPONENT: TAB VIEW: LEADERBOARD (Bảng Xếp Hạng Trainee)
 * CHỨC NĂNG CHÍNH: Vinh danh nhóm Trainee dẫn đầu và hiển thị bảng xếp hạng toàn bộ Trainee.
 * LIÊN KẾT & PHỤ THUỘC: public/js/modules/leaderboard.js, public/css/style.css
 * NHIỆM VỤ CHI TIẾT:
 *   - Hero Banner thống kê tổng quan (tổng số Trainee, sao cao nhất, điểm trung bình)
 *   - Khu vực vinh danh hiển thị đầy đủ các Trainee đồng hạng nhất
 *   - Thanh tìm kiếm theo MSSV/họ tên và bộ lọc chuyên ban (AI, Frontend, Backend, Data, etc.)
 *   - Bảng danh sách xếp hạng chi tiết, có nút bấm xem hồ sơ cá nhân từng Trainee
 * ============================================================================== -->

        <!-- ======================================================== -->
        <!-- TAB: BẢNG XẾP HẠNG Trainee (LEADERBOARD) -->
        <!-- ======================================================== -->
        <section class="tab-view" id="viewLeaderboard">

          <!-- Leaderboard Hero Header -->
          <div class="leaderboard-header-box">
            <div class="header-content">
              <h2 class="leaderboard-title">Bảng Xếp Hạng Trainee</h2>
              <p class="leaderboard-desc">
                Theo dõi sao tham gia và bảng xếp hạng của các Trainee.
              </p>
            </div>
            <div class="header-stats-summary" id="leaderboardSummaryStats">
              <!-- Dynamically populated stats -->
            </div>
          </div>

          <div class="podium-section" id="podiumSection" aria-label="Trainee dẫn đầu bảng xếp hạng"></div>

          <!-- Toolbar: Search, Filters, Sorting -->
          <div class="table-toolbar">
            <div class="search-box">

              <input type="text" id="leaderboardSearchInput" placeholder="Tìm theo tên, MSSV, email...">
            </div>

            <div class="filter-group">
              <label for="leaderboardTrackFilter">Nhóm</label>
              <select id="leaderboardTrackFilter" class="form-input"><option value="all">Tất cả</option></select>
            </div>

            <div class="sort-box">
              <select id="leaderboardSortSelect" class="sort-select" aria-label="Sắp xếp danh sách">
                <option value="stars_desc"> Số sao nhiều nhất (Mặc định)</option>
                <option value="stars_asc"> Số sao ít nhất</option>
                <option value="attended_desc"> Số buổi tham gia nhiều nhất</option>
                <option value="name_asc"> Tên Trainee (A - Z)</option>
              </select>
            </div>
          </div>

          <!-- Full Table Card -->
          <div class="portal-card table-card">
            <div class="table-responsive">
              <table class="leaderboard-table" id="leaderboardTable">
                <thead>
                  <tr>
                    <th class="th-rank" style="width: 75px; text-align: center;">Hạng</th>
                    <th class="th-student">Trainee</th>
                    <th class="th-track">Ban / Lớp</th>
                    <th class="th-stars" style="text-align: center;">Sao tích lũy </th>
                    <th class="th-sessions" style="text-align: center;">Số buổi học </th>
                    <th class="th-absent" style="text-align: center;">Buổi vắng </th>
                    <th class="th-status" style="text-align: center;">Trạng thái</th>
                    <th class="th-actions" style="text-align: center;">Thao tác</th>
                  </tr>
                </thead>
                <tbody id="leaderboardTableBody">
                  <!-- Populated by JavaScript -->
                </tbody>
              </table>
            </div>
          </div>

        <template data-private-slot="leaderboard-manage"></template>
</section>
