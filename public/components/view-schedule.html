<!-- ==============================================================================
 * COMPONENT: TAB VIEW: TIMETABLE & MONTHLY SCHEDULE (Thời Khóa Biểu & Lịch Học Trực Tuyến)
 * CHỨC NĂNG CHÍNH: Hiển thị lịch học trực tuyến MS Teams dạng tháng và dạng lịch trình chi tiết.
 * LIÊN KẾT & PHỤ THUỘC: public/js/modules/schedule.js, public/js/scheduleData.js, public/css/style.css
 * NHIỆM VỤ CHI TIẾT:
 *   - Thanh công cụ: Bộ lọc tháng/năm học, chuyển đổi chế độ xem (Lịch tháng / Danh sách)
 *   - Nút tải file Excel thời khóa biểu và tải đề cương môn học
 *   - Nút đồng bộ Google Calendar
 *   - Nút Thêm/Chỉnh sửa buổi học (chỉ dành riêng cho Admin)
 *   - Khung lịch trực quan chứa link Microsoft Teams vào học trực tiếp
 * ============================================================================== -->

        <!-- ======================================================== -->
        <!-- TAB: THỜI KHÓA BIỂU & LỊCH HỌC TRỰC TUYẾN THEO THÁNG (MS TEAMS) -->
        <!-- ======================================================== -->
        <section class="tab-view active" id="viewSchedule">

          <!-- Schedule Header Box -->
          <div class="schedule-header-box">
            <div class="schedule-title-area">
              <div class="schedule-breadcrumb">
                <span>Cổng Trainee Program</span>
                <span class="breadcrumb-sep">&rsaquo;</span>
                <span class="breadcrumb-current">Thời khóa biểu trực tuyến</span>
              </div>
              <h2 class="schedule-page-title">Thời Khóa Biểu & Lịch Học Trực Tuyến</h2>
            </div>
          </div>

          <div class="schedule-overview-card">
            <div class="schedule-filter-card">
              <div class="filter-card-header">

                <span>Chọn Tháng & Chế độ xem</span>
              </div>

              <form class="filter-controls-form" id="scheduleFilterForm">
                <div class="filter-control-item">
                  <label for="filterScheduleMonth" class="filter-control-label">Tháng xem lịch</label>
                  <input type="month" id="filterScheduleMonth" class="form-input" min="2000-01" max="2100-12" value="2026-11" required>
                </div>
                <button type="button" class="btn btn-outline" id="btnSchedulePrevious" aria-label="Xem tháng trước">
                  <span class="schedule-control-text">Tháng trước</span><span class="schedule-control-icon" aria-hidden="true">‹</span>
                </button>
                <button type="button" class="btn btn-outline" id="btnScheduleToday">
                  <span class="schedule-control-text">Tháng hiện tại</span><span class="schedule-control-mobile">Hôm nay</span>
                </button>
                <button type="button" class="btn btn-outline" id="btnScheduleNext" aria-label="Xem tháng sau">
                  <span class="schedule-control-text">Tháng sau</span><span class="schedule-control-icon" aria-hidden="true">›</span>
                </button>
              </form>
            </div>

            <div class="schedule-toolbar-row">
              <div class="schedule-mode-control">
                <span class="schedule-mode-label">Chế độ</span>
                <div class="schedule-mode-toggle">
                  <button type="button" class="mode-toggle-btn active" id="btnModeAgenda" data-mode="agenda"
                    title="Hiển thị tất cả buổi học của tháng trong 1 lần">

                    <span>Toàn bộ buổi học tháng</span>
                  </button>
                  <button type="button" class="mode-toggle-btn" id="btnModeCalendar" data-mode="calendar"
                    title="Xem theo dạng lưới lịch 31 ngày">

                    <span>Lưới lịch tháng</span>
                  </button>
                </div>
              </div>
            </div>

            <div class="schedule-month-summary" id="scheduleMonthSummary"></div>
          </div>

          <!-- Khung hiển thị Lịch học theo tháng chính (Tất cả buổi học trong 1 lần) -->
          <div class="schedule-month-container" id="scheduleMonthContainer">
            <!-- Nạp động qua JavaScript bằng ScheduleManager -->
          </div>

        </section>
