  <!-- Early Theme Initializer to prevent white overscroll & flashes -->
  <script>
    (function () {
      try {
        var mode = localStorage.getItem('uit_portal_theme_mode') || 'dark';
        var isDark = mode === 'dark' || (mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark-theme');
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.style.backgroundColor = '#0b0f19';
          document.documentElement.style.colorScheme = 'dark';
        } else {
          document.documentElement.classList.add('light-theme');
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.style.backgroundColor = '#f4f6fa';
          document.documentElement.style.colorScheme = 'light';
        }
      } catch (e) { }
    })();
  </script>
