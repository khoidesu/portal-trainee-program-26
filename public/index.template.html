  <!-- Early Theme & Sidebar Initializer to prevent white overscroll & layout flashes -->
  <script>
    (function () {
      try {
        var mode = localStorage.getItem('uit_trainee_theme_mode') || 'system';
        var isDark = mode === 'dark' || (mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark-theme');
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.style.backgroundColor = '#0b0f19';
          document.documentElement.style.colorScheme = 'dark';
        } else {
          document.documentElement.classList.add('light-theme');
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.style.backgroundColor = '#eaf4ff';
          document.documentElement.style.colorScheme = 'light';
        }
        if (localStorage.getItem('uit_portal_sidebar_collapsed') === 'true') {
          document.documentElement.classList.add('preload-sidebar-collapsed');
        }
      } catch (e) { }
    })();
  </script>
